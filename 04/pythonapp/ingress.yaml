apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: py-dashboard-ingress
spec:
  rules:
  - host: app.itclabs.live
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: py-dashboard-svc
            port: 
              number: 80
