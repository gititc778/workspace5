apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-app-ingress
spec:
  rules:
  - host: sample.itclabs.live
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: sample-app-svc
            port: 
              number: 80