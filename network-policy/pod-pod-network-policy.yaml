apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nginx-1-port-80
spec:
  podSelector:
    matchLabels:
      app: nginx-2
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: nginx-1
    ports:
    - protocol: TCP
      port: 80