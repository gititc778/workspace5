replicaCount: 2

image:
  repository: dockeritc778/py-dashboard
  pullPolicy: IfNotPresent
  tag: "v1.1"

service:
  type: NodePort
  port: 5000

ingress:
  enabled: true
  className: ""
  hosts:
    - host: dev.itclabs.live
      paths:
        - path: /
          pathType: ImplementationSpecific

resources:  
  limits:
    cpu: 100m
    memory: 50Mi
  requests:
    cpu: 100m
    memory: 50Mi

configMap:
  name: myapp
  data:
    APP_ENV: dev
    LOG_LEVEL: debug