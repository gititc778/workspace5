apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-app-label
spec:
  validationFailureAction: Enforce
  rules:
  - name: check-app-label
    match:
      any:
      - resources:
          kinds:
          - Pod
    validate:
      message: "Pods must have an app label."
      pattern:
        metadata:
          labels:
            app: "?*"