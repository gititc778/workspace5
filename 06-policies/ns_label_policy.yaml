apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: require-app-label
  namespace: default
spec:
  validationFailureAction: Enforce     
  rules:
  - name: check-app-label
    match:
      any:
      - resources:
          kinds:
          - Pod
          - Deployment
    validate:
      message: "Pods and Deployments must have an app label."
      pattern:
        metadata:
          labels:
            app: "?*"