apiVersion: v1
kind: Pod
metadata:
  name: web1
  labels:
    app: web
spec:
  serviceAccountName: pod1-sa
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"